name: Image

# 本番イメージを PR でもビルドする（push はしない）再利用可能ワークフロー。ci.yml から、差分で必要なときだけ呼ぶ。
# ベースイメージ（golang・distroless）や Dockerfile の変更は、これが無いとタグを打つまでビルドされない。
# タグ時は docker-build.yml の build-and-push が同じビルドを push 付きで行うので、ここは呼ばない。
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # タグ時のビルド（docker-build.yml）が積む buildcache を読む（パッケージは public なので認証は要らない）。
      # 書き込みはタグ時だけにする（ブランチの途中の状態でキャッシュを上書きしない）。
      - name: Build production image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: next-rum:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
