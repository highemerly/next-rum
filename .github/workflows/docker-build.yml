name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  # tag-release.yml（Actions の画面から手で実行）がタグを打ってから呼ぶ。GITHUB_TOKEN で push したタグでは
  # ワークフローが起動しないため、push を待たずに直接呼んでもらう。そのタグは github.sha に付いているので、
  # checkout（既定で github.sha）・checks・e2e もそのタグと同じコミットを見る。
  # 失敗した実行の作り直しは、Actions の画面の Re-run で行う（以前の workflow_dispatch はやめた）。
  workflow_call:
    inputs:
      version:
        description: 'Version without "v" (e.g., 1.2.3). The tag vX.Y.Z must already point at github.sha'
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # CI（gofmt / vet / test）。build-and-push と並走し、e2e と合わせて全部緑になって初めて
  # create-k8s-pr が走る（下の needs 参照）。定義は checks.yml に集約。
  checks:
    uses: ./.github/workflows/checks.yml

  # push したイメージそのもの（＝デプロイするもの）で API スモークを回す。ブランチでは差分で
  # 省いていたかもしれないので、タグでは必ず回す。定義は e2e.yml に集約。
  e2e:
    needs: build-and-push
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # マニフェストに書く値（v なしのセメンティックバージョン）。
      # 例: refs/tags/v1.2.3 -> 1.2.3
      - name: Extract version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # tag-release.yml から呼ばれたときは github.ref が main なので、版は value で渡す
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      # 本番のノードは amd64。ローカル(arm64)ビルドとの取り違えを防ぐため明示的に固定する。
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=3

  create-k8s-pr:
    # ビルド・CI・push したイメージでの e2e が全部成功したときだけ k8s マニフェストへ PR する。
    needs: [build-and-push, checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # マニフェストのリポジトリは非公開。このリポジトリの Actions のログは誰でも読めるので、リポジトリ名と
      # マニフェストのパス（image 行を持つ prd のもの、スペース区切り）もシークレットに置き、ログでは伏せる
      K8S_REPO: ${{ secrets.K8SG1_REPO }}
      K8S_MANIFEST_PATHS: ${{ secrets.K8SG1_MANIFEST_PATHS }}

    steps:
      - name: Checkout k8s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8SG1_PAT }}
          path: k8s-repo

      - name: Update image tag
        run: |
          cd k8s-repo
          for p in ${{ env.K8S_MANIFEST_PATHS }}; do
            sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}|" "$p"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: k8s-repo
          token: ${{ secrets.K8SG1_PAT }}
          branch: update-rum-collector-${{ needs.build-and-push.outputs.version }}
          delete-branch: true
          # マニフェストのリポジトリには PR が大量に来るので、自分に assign して「Assigned to you」で見落とさないようにする
          assignees: ${{ github.repository_owner }}
          commit-message: "Update rum-collector to ${{ needs.build-and-push.outputs.version }}"
          title: "Update rum-collector to ${{ needs.build-and-push.outputs.version }}"
          body: |
            ## Changes
            - Update image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}`
            - Source commit: ${{ github.repository }}@${{ github.sha }}

            ---
            🤖 Auto-generated by GitHub Actions
          labels: |
            rum-collector
