name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., v1.0.0)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_REPO: highemerly/k8sg1-repo
  # コレクタは単一 Deployment。image 行を持つマニフェストだけを更新する（スペース区切り）。
  K8S_MANIFEST_PATHS: "manifests/rum/prd/deployment.yaml"

jobs:
  # CI（gofmt / vet / test）。build-and-push と並走し、両方緑になって初めて
  # create-k8s-pr が走る（下の needs 参照）。定義は checks.yml に集約。
  checks:
    uses: ./.github/workflows/checks.yml

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # マニフェストに書く値（v なしのセメンティックバージョン）。
      # 例: refs/tags/v1.2.3 -> 1.2.3
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # VKE ノードは amd64。ローカル(arm64)ビルドとの取り違えを防ぐため明示的に固定する。
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd,compression-level=3

  create-k8s-pr:
    # ビルドと CI が両方成功したときだけ k8s マニフェストへ PR する。
    needs: [build-and-push, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout k8s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8SG1_PAT }}
          path: k8s-repo

      - name: Update image tag
        run: |
          cd k8s-repo
          for p in ${{ env.K8S_MANIFEST_PATHS }}; do
            sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}|" "$p"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: k8s-repo
          token: ${{ secrets.K8SG1_PAT }}
          branch: update-rum-collector-${{ needs.build-and-push.outputs.version }}
          delete-branch: true
          commit-message: "Update rum-collector to ${{ needs.build-and-push.outputs.version }}"
          title: "Update rum-collector to ${{ needs.build-and-push.outputs.version }}"
          body: |
            ## Changes
            - Update image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}`
            - Source commit: ${{ github.repository }}@${{ github.sha }}

            ## Notes
            `rum-config.json` は ConfigMap 管理なのでイメージ更新では変わりません。
            サービス識別子や path_group を変えたい場合は `manifests/rum/prd/configmap.yaml` を編集してください。

            ---
            🤖 Auto-generated by GitHub Actions
          labels: |
            rum-collector
