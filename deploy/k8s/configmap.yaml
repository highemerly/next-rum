# Single source of truth for service identifiers and URL path groups.
# Edit and `flux reconcile` (or kubectl apply) to roll out new grouping without
# rebuilding the binary. The collector hot-reloads this file every CONFIG_RELOAD_SECONDS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rum-config
  namespace: rum-prd
  labels:
    app: rum-collector
    app.kubernetes.io/name: rum-collector
    environment: production
data:
  rum-config.json: |
    {
      "services": {
        "handon.club":      "handon",
        "dev.handon.club":  "handon-dev",
        "hosteka.piyo.me":  "hosteka",
        "mi.hiyoko.club":   "hiyoko",
        "pic.handon.club":  "movapic-neo",
        "anypost.dev":      "anypost"
      },
      "default_service": "unknown",
      "default_path_group": "other",
      "path_groups": {
        "handon": [
          { "pattern": "/",          "group": "home" },
          { "pattern": "/web",       "group": "web_ui" },
          { "pattern": "/web/**",    "group": "web_ui" },
          { "pattern": "/@*",        "group": "profile" },
          { "pattern": "/@*/**",     "group": "status" },
          { "pattern": "/tags/**",   "group": "tag" },
          { "pattern": "/about**",   "group": "about" },
          { "pattern": "/explore**", "group": "explore" },
          { "pattern": "/public**",  "group": "public_tl" }
        ],
        "handon-dev": [
          { "pattern": "/",       "group": "home" },
          { "pattern": "/web/**", "group": "web_ui" }
        ],
        "hiyoko": [
          { "pattern": "/",            "group": "home" },
          { "pattern": "/@*",          "group": "profile" },
          { "pattern": "/notes/**",    "group": "note" },
          { "pattern": "/channels/**", "group": "channel" }
        ],
        "movapic-neo": [
          { "pattern": "/",                "group": "home" },
          { "pattern": "/create**",        "group": "create" },
          { "pattern": "/public",          "group": "timeline" },
          { "pattern": "/favorite",        "group": "timeline" },
          { "pattern": "/u/*/status/**",   "group": "photo" },
          { "pattern": "/u/*",             "group": "user" },
          { "pattern": "/u/*/**",          "group": "user" },
          { "pattern": "/notifications",   "group": "notifications" },
          { "pattern": "/dashboard",       "group": "dashboard" },
          { "pattern": "/settings**",      "group": "settings" },
          { "pattern": "/docs**",          "group": "docs" },
          { "pattern": "/announcements**", "group": "announcements" },
          { "pattern": "/stats",           "group": "stats" },
          { "pattern": "/terms",           "group": "legal" },
          { "pattern": "/privacy",         "group": "legal" },
          { "pattern": "/license",         "group": "legal" },
          { "pattern": "/admin/**",        "group": "admin" }
        ],
        "anypost": [
          { "pattern": "/",        "group": "home" },
          { "pattern": "/posts/**", "group": "post" }
        ],
        "hosteka": [
          { "pattern": "/",                   "group": "home" },
          { "pattern": "/events",             "group": "event_list" },
          { "pattern": "/events/hashtag/*",   "group": "event_list" },
          { "pattern": "/events/create",      "group": "event_form" },
          { "pattern": "/events/*/edit",      "group": "event_form" },
          { "pattern": "/events/*",           "group": "event" },
          { "pattern": "/events/*/**",        "group": "event_sub" },
          { "pattern": "/pre-events",         "group": "pre_event_list" },
          { "pattern": "/pre-events/create",  "group": "pre_event_form" },
          { "pattern": "/pre-events/*/edit",  "group": "pre_event_form" },
          { "pattern": "/pre-events/*",       "group": "pre_event" },
          { "pattern": "/pre-events/*/**",    "group": "pre_event_sub" },
          { "pattern": "/orgs/**",            "group": "org" },
          { "pattern": "/users/*",            "group": "user" },
          { "pattern": "/dashboard**",        "group": "dashboard" },
          { "pattern": "/account**",          "group": "account" },
          { "pattern": "/auth/**",            "group": "auth" },
          { "pattern": "/announcements**",    "group": "announcements" },
          { "pattern": "/faq",                "group": "docs" },
          { "pattern": "/feature",            "group": "docs" },
          { "pattern": "/markdown-guide",     "group": "docs" },
          { "pattern": "/release-notes",      "group": "docs" },
          { "pattern": "/terms",              "group": "legal" },
          { "pattern": "/privacy",            "group": "legal" },
          { "pattern": "/admin**",            "group": "admin" }
        ],
        "*": [
          { "pattern": "/", "group": "home" }
        ]
      }
    }
