# rum-collector IngressRoute (本番環境)
# Traefik CRD を使用。/metrics は意図的に載せない（VMAgent が Service 経由で直接 scrape する）。
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rum-collector
  namespace: rum-prd
  labels:
    app: rum-collector
    app.kubernetes.io/name: rum-collector
    environment: production
spec:
  entryPoints:
    - websecure
  routes:
    - match: >-
        Host(`rum.piyo.me`) &&
        (Path(`/beacon.js`) || Path(`/web-vitals.js`) ||
         Path(`/rum-config.json`) || Path(`/collect`) || Path(`/healthz`))
      kind: Rule
      services:
        - name: rum-collector
          port: 8080
      middlewares:
        - name: security-headers
          namespace: traefik
        - name: compress-gzip
          namespace: traefik
  tls:
    secretName: rum-tls
