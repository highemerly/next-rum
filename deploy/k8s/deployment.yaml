# rum-collector Deployment + Service (本番環境)
# image 行は GitHub Actions (docker-build.yml) が sed で書き換える。書式を変えないこと。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rum-collector
  namespace: rum-prd
  labels:
    app: rum-collector
    app.kubernetes.io/name: rum-collector
    app.kubernetes.io/component: collector
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rum-collector
  template:
    metadata:
      labels:
        app: rum-collector
        app.kubernetes.io/name: rum-collector
        app.kubernetes.io/component: collector
    spec:
      securityContext:
        runAsNonRoot: true
        # distroless の nonroot ユーザー。runAsNonRoot は名前 (USER nonroot) だと
        # 非 root かを kubelet が検証できないため、数値 UID/GID を明示する。
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: rum-collector
          image: ghcr.io/highemerly/next-rum:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: CONFIG_PATH
              value: /etc/rum/rum-config.json
            # Loki は gateway 無効の SingleBinary 構成。Fluent Bit と同じ宛先を使う。
            - name: LOKI_URL
              value: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
            - name: ASSET_MAX_AGE_SECONDS
              value: "300"
            - name: CONFIG_RELOAD_SECONDS
              value: "60"
            # CF 由来の geo シグナルのヘッダ名（CF Transform Rule と揃えること。
            # 変更時はここだけ直せばよく、再ビルドは不要）。
            - name: GEO_COUNTRY_HEADER
              value: "CF-IPCountry"
            - name: GEO_ASN_HEADER
              value: "HAN-CF-ASN"
          volumeMounts:
            - name: rum-config
              mountPath: /etc/rum
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: rum-config
          configMap:
            name: rum-config
---
apiVersion: v1
kind: Service
metadata:
  name: rum-collector
  namespace: rum-prd
  labels:
    app: rum-collector
    app.kubernetes.io/name: rum-collector
spec:
  type: ClusterIP
  selector:
    app: rum-collector
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
