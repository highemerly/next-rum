apiVersion: apps/v1
kind: Deployment
metadata:
  name: rum-collector
  namespace: rum
  labels:
    app: rum-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rum-collector
  template:
    metadata:
      labels:
        app: rum-collector
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: rum-collector
          image: ghcr.io/highemerly/rum-collector:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: CONFIG_PATH
              value: /etc/rum/rum-config.json
            - name: LOKI_URL
              value: http://loki-gateway.monitoring.svc:80/loki/api/v1/push
            - name: ASSET_MAX_AGE_SECONDS
              value: "300"
            - name: CONFIG_RELOAD_SECONDS
              value: "60"
          volumeMounts:
            - name: rum-config
              mountPath: /etc/rum
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: rum-config
          configMap:
            name: rum-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rum-collector
  namespace: rum
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rum-collector
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
